[project]
name = "events-briefing"
version = "0.1.1"
description = "Offline-capable NYC incident ranking and approval-gated briefing lab. Code is MIT; NYC Open Data snapshots keep the City's terms."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Lescano" }]
keywords = ["nyc-open-data", "briefing", "evals", "offline"]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  "pre-commit>=3.5.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
]

[project.scripts]
events-briefing = "events_briefing.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["events_briefing"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=events_briefing --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["events_briefing"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
