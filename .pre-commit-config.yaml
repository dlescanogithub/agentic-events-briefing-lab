# Hooks use the tools installed by `python -m pip install -e ".[dev]"`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: secretscan
        name: secretscan
        entry: python -m events_briefing secretscan
        language: system
        pass_filenames: false
        always_run: true
